<h1>Email Type Example 📧</h1>
<form>
    <h3>Using "type":</h3>
    <input type="text">
    <input type="submit">
    <!-- abcdefghijklmnopqrstuvwxyx -->
</form>
<form>
    <h3>Using "email":</h3>
    <input type="email">
    <input type="submit">
    <!-- notarealemail@email.com -->
</form>
<form>
    <h3>Error Example W/ "email":</h3>
    <input type="email">
    <input type="submit">
    <!-- notarealemail.com -->
</form>
