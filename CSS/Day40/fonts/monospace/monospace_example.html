<!DOCTYPE html>
<html>
    <head>
        <title>Font Families ✍️</title>
        <link href="monospace.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Font Families! ✍️</h1>
        </header>
        <main>
            <h2 id="monospace">Monospace</h2>
            <p>
                Each character takes up the same amount of horizontal space, often used for computer programming.
            </p>
            <p><u>Examples:</u></p>
            <ul>
                <li id="consolas">Consolas</li>
                <li id="courier-new">Courier New</li>
                <li id="lucida-console">Lucida Console</li>
            </ul>
        </main>
    </body>
</html>
