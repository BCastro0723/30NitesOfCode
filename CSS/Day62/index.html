<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet" />
        <title>My Museum Gallery 🖼️</title>
    </head>
    <body>
        <div id="gallery-container">
            <h1 id="gallery-header">My Museum Gallery 🖼️</h1>
            <p>How Will You Arrange Your Visit?</p>
            <a href="#fav-paintings-section" class="btn">
                <div id="fav-paintings-btn">
                    Favorite Paintings
                </div>
            </a>
            <a href="#fav-fruits-section" class="btn">
                <div id="fav-fruits-btn">
                    Favorite Fruits
                </div>
            </a>
            <a href="#fav-vegetables-section" class="btn">
                <div id="fav-vegetables-btn">
                    Favorite Vegetables
                </div>
            </a>
        </div>
        <div id="image-gallery">
            <section id="fav-paintings-section">
                <h2 class="section-title">Favorite Paintings 🖌️🎨</h2>
                <figure class="painting">
                    <img 
                        src="https://sites.harding.edu/gclayton/2DDesign/Crits/images/VanGogh_StarryNight01m.jpg" 
                        alt="The Starry Night by Vincent van Gogh" 
                        class="gallery-item" 
                        id="item-1" />
                    <figcaption>The Starry Night by <br>Vincent van Gogh</figcaption>
                </figure>
                <figure class="painting">
                    <img 
                        src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/1280px-1665_Girl_with_a_Pearl_Earring.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail" 
                        alt="Girl with a Pearl Earring by Johannes Vermeer" 
                        class="gallery-item" 
                        id="item-2" />
                    <figcaption>Girl with a Pearl Earring by <br>Johannes Vermeer</figcaption>
                </figure>
                <figure class="painting">
                    <img 
                        src="https://d7hftxdivxxvm.cloudfront.net/?height=800&quality=85&resize_to=fit&src=https%3A%2F%2Fd32dm0rphc51dk.cloudfront.net%2FxscrFu940ykaXFUJw9cdXA%2Fnormalized.jpg&width=622" 
                        alt="Wanderer Above the Sea of Fog by Caspar David Friedrich" 
                        class="gallery-item" 
                        id="item-3" />
                    <figcaption>Wanderer Above the Sea of Fog by <br>Caspar David Friedrich</figcaption>
                </figure>
            </section>
            <section id="fav-fruits-section">
                <h2 class="section-title">Favorite Fruits 🍊🍌🍉</h2>
                <figure class="painting">
                    <img 
                        src="https://i.pinimg.com/564x/a6/71/ab/a671ab91e4108f92204e2e59b68e0ccf.jpg" 
                        alt="mandarin by Gennady Vylusk" 
                        class="gallery-item" 
                        id="item-4" />
                    <figcaption>mandarin by Gennady Vylusk</figcaption>
                </figure>
                <figure class="painting">
                    <img 
                        src="./images/bananas_jennifer_doehring.jpg" 
                        alt="Bananas by Jennifer Doehring" 
                        class="gallery-item" 
                        id="item-5" />
                    <figcaption>Bananas by Jennifer Doehring</figcaption>
                </figure>
                <figure class="painting">
                    <img 
                        src="./images/watermelon_lucia_febronia.jpg" 
                        alt="Watermelon by Lucia Febronia" 
                        class="gallery-item" 
                        id="item-6" />
                    <figcaption>Watermelon by Lucia Febronia</figcaption>
                </figure>
            </section>
            <section id="fav-vegetables-section">
                <h2 class="section-title">Favorite Vegetables 🫑🧅🍠</h2>
                <figure class="painting">
                    <img    
                        src="./images/bell_peppers_mayrig_simonjan.jpg" 
                        alt="Bell peppers by Mayrig Simonjan" 
                        class="gallery-item" 
                        id="item-7" />
                    <figcaption>Bell peppers by Mayrig Simonjan</figcaption>
                </figure>
                <figure class="painting">
                    <img 
                        src="https://i.etsystatic.com/15300521/r/il/c5e496/6218519389/il_fullxfull.6218519389_etjd.jpg" 
                        alt="Onion by S. Lee Mark" 
                        class="gallery-item" 
                        id="item-8" />
                    <figcaption>Onion by S. Lee Mark</figcaption>
                </figure>
                <figure class="painting">
                    <img 
                        src="https://shengyilee.com/wp-content/uploads/2022/11/Sweet-potato.jpg" 
                        alt="Sweet Potato by Sheng Yi" 
                        class="gallery-item" 
                        id="item-1" />
                    <figcaption>Sweet Potato by Sheng Yi</figcaption>
                </figure>
            </section>
        </div>
        <a href="#fav-paintings-section">
            <img 
                src="./images/up_arrow.png"
                alt="up arrow"
                id="up-arrow"
                href="#gallery-container"
            />
        </a>
    </body>
</html>
