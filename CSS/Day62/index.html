        <link href="styles.css" rel="stylesheet" />
        <title>My Museum Gallery 🖼️</title>

    <body>
        <div id="gallery-container">
            <h1 id="gallery-header">My Museum Gallery 🖼️</h1>
            <p>How Will You Arrange Your Visit?</p>
            <a href="#favorite-paintings" class="btn">
                <div id="fav-paintings-btn">
                    Favorite Paintings
                </div>
            </a>
            <a href="#favorite-fruits" class="btn">
                <div id="fav-fruits-btn">
                    Favorite Fruits
                </div>
            </a>
            <a href="#favorite-vegetables" class="btn">
                <div id="fav-vegetables-btn">
                    Favorite Vegetables
                </div>
            </a>
        </div>
        <hr>
        <!-- Add images here -->

        <!-- <img src="https://github.com/codedex-io/css-101/blob/main/4-layout/25-art-gallery/images/greek-sculpture.png?raw=true" alt="" class= "gallery-item" id="item-2">  -->
        <!-- Right-click on an image in the /images folder, and Copy Image Address --> 
        <div id="image-gallery">
            <h2 class="section-title" id="favorite-paintings">Favorite Paintings 🖌️🎨</h2>
            <img src="https://sites.harding.edu/gclayton/2DDesign/Crits/images/VanGogh_StarryNight01m.jpg" alt="The Starry Night by Vincent van Gogh" class="gallery-item" id="item-1" />
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/1280px-1665_Girl_with_a_Pearl_Earring.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="Girl with a Pearl Earring by Johannes Vermeer" class="gallery-item" id="item-2" />

            <h2 class="section-title" id="favorite-fruits">Favorite Fruits 🍊🍌🍉</h2>

            <img src="./images/bananas_jennifer_doehring.jpg" alt="Bananas by Jennifer Doehring" class="gallery-item" id="item-5" />
            <img src="./images/watermelon_lucia_febronia.jpg" alt="Watermelon by Lucia Febronia" class="gallery-item" id="item-6" />

            <img src="./images/bell_peppers_mayrig_simonjan.jpg" alt="Bell peppers by Mayrig Simonjan" class="gallery-item" id="item-7" />
            <img src="https://i.etsystatic.com/15300521/r/il/c5e496/6218519389/il_fullxfull.6218519389_etjd.jpg" alt="Onion S. Lee Mark" class="gallery-item" id="item-8" />
            <img src="https://shengyilee.com/wp-content/uploads/2022/11/Sweet-potato.jpg" alt="Sweet Potato by Sheng Yi" class="gallery-item" id="item-1" />

        <a href="#image-gallery">

                src="./images/up_arrow.png"
