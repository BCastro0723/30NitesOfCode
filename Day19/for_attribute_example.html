<form>
    <h1>OurSpace Account Creation 👥</h1>
    Profile Pic 📸:<br>
    <img 
        src="https://comicvine.gamespot.com/a/uploads/scale_medium/10/100757/1893526-fosters_home_for_imaginary_friends_candi_milo_3.jpg"
        width="250px"
        alt="User Uploaded Profile Pic"
    />
    <br><br>
    <label for="name">Name 🏷️: </label>
    <input type="text" id="name" required>
    <br>
    <label for="bio">Bio 🧾: </label>   
    <br>
    <textarea rows="5" cols="30"
        placeholder="Tell us about yourself!"
        id="bio"></textarea>
    <br>
    <label for="quote">Favorite Quote 💬: </label>   
    <br>
    <textarea rows="3" cols="30"
        placeholder="Your most funny, inspiring, or intimidating quote here!"
        id="quote"></textarea>
    <br><br>
    <input type="submit" value="Create Account 👋">
</form>
