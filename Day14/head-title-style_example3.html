<!DOCTYPE html>
<!--This is our HTML Element 🧱-->
<html>
    <!--This is our Head Element 🧠-->
    <head>
        <!--This is our Title Element 📕-->
        
        <!--This is our *Optional Style Element 🎨-->
        <style>
            element {
                property: value;
            }
            p {
                color: purple;
            }
        </style>
    </head>
    <!--This is our Body Element 📖-->
    <body>
        <h1>
            I am NOT Title, just H1.
        </h1>
        <p>
            I got targeted by the Style Element! 🎯🖌️
        </p>
    </body>
</html>
