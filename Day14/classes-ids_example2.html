<!DOCTYPE html>
<html>
    <head>
        <title>Foods & Drinks 🍎🍹</title>
        <style>
            ol {
                list-style-type: upper-alpha;
            }
            .food {
                text-decoration: underline;
            }
            .fruit {
                background-color: pink;
            }
            .entree {
                background-color: yellow;
            }
            #favorite-fruit {
                font-size: 25px;
            }
        </style>
    </head>
    <body>
        <h1>Foods 🍔🍕🌮</h1>
        <ol>
            <li class="food dairy">Cheese 🧀</li>
            <li class="food fruit">Mandarins 🍊</li>
            <li class="food fruit">Strawberries 🍓</li>
            <li class="food entree">Tacos 🌮</li>
            <li class="food entree">Pho 🍜</li>
            <li class="food fruit" id="favorite-fruit">Watermelon 🍉</li>
            <li class="food fruit">Mango 🥭</li>
        </ol>
    </body>
</html>
