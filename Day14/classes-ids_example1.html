<!DOCTYPE html>
<html>
    <head>
        <title>Foods & Drinks 🍎🍹</title>
        <style>
            ol {
                list-style-type: upper-alpha;
            }
            #favorite-food {
                background-color: pink;
            }
            #favorite-drink {
                background-color: yellow;
            }
            .food {
                text-decoration: underline;
            }
            .drink {
                text-decoration: overline;
            }
        </style>
    </head>
    <body>
        <h1>Foods & Drinks 🍎🍹</h1>
        <h3>Foods 🍎🍊🍌</h3>
        <ol>
            <li class="food">Cheese 🧀</li>
            <li class="food">Mandarins 🍊</li>
            <li class="food" id="favorite-food">Strawberries 🍓</li>
            <li class="food">Tacos 🌮</li>
        </ol>
        <h3>Drinks 🍹🍵☕</h3>
        <ol>
            <li class="drink">Water 💧</li>
            <li class="drink" id="favorite-drink">Lemonade 🍋</li>
            <li class="drink">Tea 🍵</li>
            <li class="drink">Coffee ☕</li>
        </ol>
    </body>
</html>
